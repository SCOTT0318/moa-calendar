name: Windows build and checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build application
        shell: pwsh
        run: ./build.ps1
      - name: Core, mocked integrations and WPF checks
        shell: pwsh
        run: ./test.ps1
      - name: Build self-contained installer
        shell: pwsh
        run: ./build-installer.ps1
      - name: Verify isolated installation and preservation
        shell: pwsh
        run: ./installer/verify-installer.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moa-windows-checks
          path: |
            Evidence/*result.json
            Evidence/*.png
            dist/Moa-Setup.exe
            dist/Moa-win-x64.zip
            dist/SHA256SUMS.txt
